name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Smoke test dist
        run: npm run smoke

      # Pack and check the bundle before publishing: npm publish can't be
      # undone, so it goes last. This also checks the bundle under the npm this
      # job installs, which CI never uses.
      - name: Pack .mcpb bundle
        run: npm run pack:mcpb

      - name: Validate and smoke test .mcpb bundle
        run: |
          unzip -q kosli-mcp-server-*.mcpb -d "$RUNNER_TEMP/mcpb"
          npx --no-install mcpb validate "$RUNNER_TEMP/mcpb/manifest.json"
          npm run smoke -- "$RUNNER_TEMP/mcpb/dist/index.js"

      - name: Publish to npm
        # Auth is npm Trusted Publishing (OIDC) — that is what id-token: write above
        # is for, not provenance. Dropping it breaks publishing entirely.
        # Trusted publishing already generates provenance on a public repo; passing
        # --provenance makes it fail loudly rather than silently skip if that changes.
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: '*.mcpb'
          generate_release_notes: true
