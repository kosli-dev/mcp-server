name: Update catalog

on:
  schedule:
    - cron: '0 7 * * 1' # Every Monday at 07:00 UTC (09:00 CET)
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate catalog
        run: npm run generate-catalog

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet src/catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          branch: chore/update-catalog
          sign-commits: true # main requires signed commits; unsigned bot commits can't be merged
          commit-message: 'chore: regenerate catalog from OpenAPI spec'
          title: 'chore: regenerate catalog from OpenAPI spec'
          body: |
            Automated catalog update from the [Kosli OpenAPI spec](https://app.kosli.com/api/v2/openapi.json).

            Please review the diff to verify the changes look correct before merging.
          delete-branch: true
