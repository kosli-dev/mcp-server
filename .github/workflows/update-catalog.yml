name: Update catalog

on:
  schedule:
    - cron: '0 7 * * 1' # Every Monday at 07:00 UTC (09:00 CET)
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate catalog
        run: npm run generate-catalog

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet src/catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/update-catalog
          sign-commits: true # main requires signed commits; unsigned bot commits can't be merged
          commit-message: 'chore: regenerate catalog from OpenAPI spec'
          title: 'chore: regenerate catalog from OpenAPI spec'
          body: |
            Automated catalog update from the [Kosli OpenAPI spec](https://app.kosli.com/api/v2/openapi.json).

            Please review the diff to verify the changes look correct before merging.
          delete-branch: true
