name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # 22 is the floor declared in package.json engines; 24 is what release.yml
    # publishes from. Testing both ends stops either drifting untested.
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # '22.12' rather than '22': the dev toolchain (Vite 8, via vitest) needs
        # >=22.12, and a bare '22' resolves to the latest 22.x, so the bottom of
        # the supported range would never actually be tested.
        node-version: ['22.12', '24']
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack .mcpb bundle (smoke test)
        run: npm run pack:mcpb
