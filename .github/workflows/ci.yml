name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # kosli attest pullrequest github reads the PR that merged the commit.
  pull-requests: read

jobs:
  test:
    # 22.12 is the dev floor (see the matrix comment); 24 is what release.yml
    # publishes from. Testing both ends stops either drifting untested.
    # consumer-floor is the exact version engines allows: one leg also runs the
    # bundle on it. It is declared here, once, so the steps that use it can't
    # silently stop matching when the matrix changes.
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # '22.12' rather than '22': the dev toolchain (Vite 8, via vitest) needs
        # >=22.12, and a bare '22' resolves to the latest 22.x, so the bottom of
        # the supported range would never actually be tested.
        node-version: ['22.12', '24']
        include:
          - node-version: '22.12'
            consumer-floor: '22.0.0'
    # Commits on main report to the mcp-server-ci flow in kosli-public, from
    # one leg only: every leg attesting under the same names would overwrite
    # each other. 24 is the leg release.yml matches. Pushes only, so fork PRs,
    # which get no secrets, never reach a Kosli step, and the trail is a commit
    # that exists on main rather than a PR's ephemeral merge commit.
    # The token and org are set on the Kosli steps alone, never job-wide: the
    # tests and the smoke test read KOSLI_API_TOKEN and KOSLI_ORG too.
    env:
      REPORT_TO_KOSLI: ${{ github.event_name == 'push' && matrix.node-version == '24' }}
      KOSLI_FLOW_NAME: mcp-server-ci
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Kosli CLI
        if: env.REPORT_TO_KOSLI == 'true'
        uses: kosli-dev/setup-cli-action@b90ac9b0ddfce708c687f198430f54dfa960f80d # v5.2.3
        with:
          version: '2'

      # create flow is an upsert: it keeps the flow's template in step with
      # kosli/ci-template.yml.
      - name: Begin Kosli trail
        if: env.REPORT_TO_KOSLI == 'true'
        env:
          KOSLI_API_TOKEN: ${{ secrets.KOSLI_PUBLIC_API_TOKEN }}
          KOSLI_ORG: kosli-public
        run: |
          kosli create flow "${KOSLI_FLOW_NAME}" \
            --description "CI for kosli-dev/mcp-server: commits on main" \
            --template-file kosli/ci-template.yml
          kosli begin trail "${GITHUB_SHA}" \
            --flow "${KOSLI_FLOW_NAME}" \
            --description "Run ${GITHUB_RUN_NUMBER}: ${GITHUB_REF_NAME}"

      - name: Attest pull request
        if: env.REPORT_TO_KOSLI == 'true'
        env:
          KOSLI_API_TOKEN: ${{ secrets.KOSLI_PUBLIC_API_TOKEN }}
          KOSLI_ORG: kosli-public
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          kosli attest pullrequest github \
            --github-token "${GITHUB_TOKEN}" \
            --flow "${KOSLI_FLOW_NAME}" \
            --trail "${GITHUB_SHA}" \
            --name pull-request

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # tsconfig.json covers src only and vitest strips types, so without this
      # a type error in test/ or scripts/ never fails anything.
      - name: Typecheck
        run: npm run typecheck

      # The JUnit report is what the Kosli attestation reads; it costs nothing
      # on the legs that don't attest.
      - name: Test
        id: test
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml

      # Runs when the tests fail too: Kosli derives compliance from the report,
      # so a failing run is recorded rather than missing.
      - name: Attest unit tests
        if: ${{ !cancelled() && env.REPORT_TO_KOSLI == 'true' && steps.test.outcome != 'skipped' }}
        env:
          KOSLI_API_TOKEN: ${{ secrets.KOSLI_PUBLIC_API_TOKEN }}
          KOSLI_ORG: kosli-public
        run: |
          kosli attest junit \
            --flow "${KOSLI_FLOW_NAME}" \
            --trail "${GITHUB_SHA}" \
            --name unit-tests \
            --results-dir test-results

      # Starts the built server over real stdio: catches what the in-memory
      # tests can't, like the bin entry or the JSON imports failing to load.
      - name: Smoke test dist
        run: npm run smoke

      # The smoke steps are only worth anything if they fail when the server
      # does. Pin that, so a refactor that swallows the error can't turn them
      # into steps that always pass.
      # Requires smoke's own "not ok" line, so a crash in the smoke script
      # itself (a bad import, a missing tsx) can't pass for a caught failure.
      - name: Smoke test fails on a broken server
        run: |
          if out=$(npm run smoke -- does-not-exist.js 2>&1); then
            echo "::error::smoke test passed against a missing entry point"
            exit 1
          fi
          if ! grep -q '^not ok - ' <<<"$out"; then
            echo "$out"
            echo "::error::smoke test failed without reporting a failed check"
            exit 1
          fi

      - name: Pack .mcpb bundle
        run: npm run pack:mcpb

      # Validates the manifest inside the bundle, the one users install, with
      # the version pack-mcpb.sh injected, not the repo's placeholder copy.
      # The smoke test runs the server from the unzipped bundle, so it resolves
      # against the bundled production node_modules rather than the repo's.
      - name: Validate and smoke test .mcpb bundle
        run: |
          unzip -q kosli-mcp-server-*.mcpb -d "$RUNNER_TEMP/mcpb"
          npx --no-install mcpb validate "$RUNNER_TEMP/mcpb/manifest.json"
          npm run smoke -- "$RUNNER_TEMP/mcpb/dist/index.js"

      # The matrix floor is the dev floor (vitest needs a newer 22.x), but
      # users run the bundle on anything engines allows. Run it once on the
      # consumer floor itself; before 22.7 Node won't detect ESM by syntax, so
      # this is what catches a bundle missing its "type": "module".
      # The switch is job-wide, so the client side (tsx, the SDK client) runs on
      # the floor too. If this fails after a dev-tooling bump, check that before
      # suspecting the bundle.
      - name: Setup Node at the consumer floor
        if: matrix.consumer-floor
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.consumer-floor }}

      - name: Smoke test .mcpb bundle on the consumer floor
        if: matrix.consumer-floor
        run: npm run smoke -- "$RUNNER_TEMP/mcpb/dist/index.js"
