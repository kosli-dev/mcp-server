name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # 22.12 is the dev floor (see the matrix comment); 24 is what release.yml
    # publishes from. Testing both ends stops either drifting untested.
    # consumer-floor is the exact version engines allows: one leg also runs the
    # bundle on it. It is declared here, once, so the steps that use it can't
    # silently stop matching when the matrix changes.
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # '22.12' rather than '22': the dev toolchain (Vite 8, via vitest) needs
        # >=22.12, and a bare '22' resolves to the latest 22.x, so the bottom of
        # the supported range would never actually be tested.
        node-version: ['22.12', '24']
        include:
          - node-version: '22.12'
            consumer-floor: '22.0.0'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # tsconfig.json covers src only and vitest strips types, so without this
      # a type error in test/ or scripts/ never fails anything.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Starts the built server over real stdio: catches what the in-memory
      # tests can't, like the bin entry or the JSON imports failing to load.
      - name: Smoke test dist
        run: npm run smoke

      # The smoke steps are only worth anything if they fail when the server
      # does. Pin that, so a refactor that swallows the error can't turn them
      # into steps that always pass.
      - name: Smoke test fails on a broken server
        run: |
          if npm run smoke -- does-not-exist.js; then
            echo "::error::smoke test passed against a missing entry point"
            exit 1
          fi

      - name: Pack .mcpb bundle
        run: npm run pack:mcpb

      # Validates the manifest inside the bundle, the one users install, with
      # the version pack-mcpb.sh injected, not the repo's placeholder copy.
      # The smoke test runs the server from the unzipped bundle, so it resolves
      # against the bundled production node_modules rather than the repo's.
      - name: Validate and smoke test .mcpb bundle
        run: |
          unzip -q kosli-mcp-server-*.mcpb -d "$RUNNER_TEMP/mcpb"
          npx --no-install mcpb validate "$RUNNER_TEMP/mcpb/manifest.json"
          npm run smoke -- "$RUNNER_TEMP/mcpb/dist/index.js"

      # The matrix floor is the dev floor (vitest needs a newer 22.x), but
      # users run the bundle on anything engines allows. Run it once on the
      # consumer floor itself; before 22.7 Node won't detect ESM by syntax, so
      # this is what catches a bundle missing its "type": "module".
      # The switch is job-wide, so the client side (tsx, the SDK client) runs on
      # the floor too. If this fails after a dev-tooling bump, check that before
      # suspecting the bundle.
      - name: Setup Node at the consumer floor
        if: matrix.consumer-floor
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.consumer-floor }}

      - name: Smoke test .mcpb bundle on the consumer floor
        if: matrix.consumer-floor
        run: npm run smoke -- "$RUNNER_TEMP/mcpb/dist/index.js"
