version: 2
updates:
  # Keep the SHA-pinned actions in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
    ignore:
      # @types/node must track the Node floor in engines, not the newest release —
      # otherwise tsc stops rejecting APIs that don't exist on the minimum runtime.
      # Raise this deliberately when the floor moves.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
