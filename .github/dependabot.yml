version: 2
updates:
  # Keep the SHA-pinned actions in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci'
    # Hold new releases back a week, so a compromised or broken one has time
    # to be noticed and yanked before it is proposed here.
    cooldown:
      default-days: 7
    # SHA bumps edit the same lines across the workflows, so separate PRs
    # conflict with each other. One PR, rebased once.
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
    cooldown:
      default-days: 7
    # Majors stay ungrouped so each gets its own review. The SDK and zod are the
    # runtime dependencies, so they are kept apart from the dev tooling, and
    # grouped together: the SDK builds tool schemas with zod and declares it as
    # a peer, so they move as one.
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      sdk:
        patterns: ['@modelcontextprotocol/sdk', 'zod']
        update-types: [minor, patch]
    ignore:
      # @types/node must track the Node floor in engines, not the newest release —
      # otherwise tsc stops rejecting APIs that don't exist on the minimum runtime.
      # Raise this deliberately when the floor moves.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
